name: Quality checks
on: [pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sunheart/web run typecheck
      - run: pnpm --filter @sunheart/web run build
      - run: pnpm --filter @sunheart/web run test
      - run: pip install -r apps/api/requirements.txt && python -m unittest discover -s tests -p 'test_*.py' && python -m compileall -q apps/api
